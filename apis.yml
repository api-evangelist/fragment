aid: fragment
name: Fragment
description: >-
  Fragment is the ledger API for engineers who move money. It provides a
  double-entry accounting engine — "the database for money" — that lets
  developers model any funds flow as declarative, typed schemas and post
  balanced, immutable ledger entries through a GraphQL API. Fragment generates
  a typesafe SDK from your chart-of-accounts schema, tracks real-time,
  historical, period, and strongly-consistent balances across multi-currency
  and custom-currency accounts, and reconciles internal ledgers against
  external systems (Stripe, Increase, Unit, banks) via linked and external
  accounts. Every write mutation is idempotent (per-Ledger idempotency keys),
  responses are GraphQL union types with typed errors, list queries are
  cursor-paginated, and the API is deployed across AWS regions. Fragment is
  used by companies including Bill, Ramp, Pleo, AtoB, Basic Capital, and Nala,
  and is backed by General Catalyst.
