apis:
- name: Fragment Ledger API
  description: >-
    Fragment's GraphQL Ledger API. Store a double-entry chart-of-accounts
    schema, create ledgers, post idempotent ledger entries and lines, read
    aggregated / historical / period / strongly-consistent balances, reverse
    and migrate entries, group entries, and reconcile against external
    accounts and transactions (links). OAuth2 client-credentials auth, typed
    union responses, and cursor pagination.
